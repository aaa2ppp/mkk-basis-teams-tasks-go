apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:8.10.1-alpine
        ports:
        - containerPort: 6379
        env:
        - name: REDISCLI_AUTH
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: REDIS_PASSWORD
        args:
        - "--requirepass"
        - "$(REDISCLI_AUTH)"
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli ping
          initialDelaySeconds: 2
          periodSeconds: 2
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
