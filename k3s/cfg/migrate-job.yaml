apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300 
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: ${MIGRATE_IMG}
        env:
        - name: DB_ADDR
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_ADDR
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: DB_PASSWORD
